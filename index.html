<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTTEC 2.0 — Engenharia Industrial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        carbon: {
                            950: '#09090b',
                            900: '#111114',
                            850: '#18181c',
                            800: '#222227',
                        },
                        crimson: {
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                color: #09090b !important;
                padding: 1.5rem;
            }
            .no-print { display: none !important; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #09090b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #dc2626; }
    </style>
</head>
<body class="h-full bg-carbon-950 text-zinc-100 flex overflow-hidden font-sans">

    <!-- SIDEBAR: PÁGINAS DE PROCESSOS -->
    <aside class="w-64 bg-carbon-900 border-r border-zinc-800 flex flex-col justify-between no-print shrink-0">
        <div class="flex flex-col flex-1 overflow-hidden">
            <!-- Logo Industrial -->
            <div class="p-4 border-b border-zinc-800 flex items-center gap-3">
                <div class="w-9 h-9 bg-crimson-600 rounded-lg flex items-center justify-center font-black text-white text-base tracking-tighter shadow-lg shadow-crimson-600/20">
                    A2
                </div>
                <div>
                    <div class="font-extrabold text-sm tracking-wide uppercase text-white">AUTTEC <span class="text-crimson-500">2.0</span></div>
                    <div class="text-[10px] font-mono text-zinc-500 uppercase">Processos & Produção</div>
                </div>
            </div>

            <!-- Botão Nova Página -->
            <div class="p-3 border-b border-zinc-800/80">
                <button onclick="app.createPage()" class="w-full bg-crimson-600 hover:bg-crimson-700 text-white py-2 px-3 rounded-lg text-xs font-bold uppercase tracking-wider transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nova Página
                </button>
            </div>

            <!-- Lista de Páginas -->
            <div class="p-2 flex-1 overflow-y-auto custom-scrollbar space-y-1" id="pages-list">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- Rodapé Sidebar -->
        <div class="p-3 border-t border-zinc-800 text-[11px] text-zinc-500 flex justify-between items-center">
            <span>Salvo localmente</span>
            <button onclick="app.resetAll()" class="text-zinc-500 hover:text-crimson-500 transition" title="Resetar tudo">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL DA PÁGINA ATIVA -->
    <main class="flex-1 flex flex-col overflow-hidden bg-carbon-950">

        <!-- BARRA SUPERIOR DE AÇÕES -->
        <header class="h-14 bg-carbon-900 border-b border-zinc-800 px-6 flex items-center justify-between no-print shrink-0">
            <div class="flex items-center gap-3">
                <span class="w-2 h-2 rounded-full bg-crimson-500"></span>
                <span class="text-xs font-mono uppercase text-zinc-400">Página Ativa:</span>
                <span id="header-page-title" class="text-sm font-bold text-white truncate max-w-md">—</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="app.openITModal()" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf text-crimson-500"></i> Gerar PDF (IT & BOM)
                </button>
                <button onclick="app.deleteCurrentPage()" class="bg-zinc-900 hover:bg-crimson-950 border border-zinc-800 hover:border-crimson-800 text-zinc-400 hover:text-crimson-400 p-2 rounded-lg text-xs transition" title="Excluir esta página">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </header>

        <!-- CONTEÚDO ROLÁVEL DA PÁGINA -->
        <div class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-6" id="page-workspace">
            <!-- Gerado via JS -->
        </div>
    </main>

    <!-- DRAWER LATERAL: EDIÇÃO TÉCNICA DA CÉLULA -->
    <aside id="cell-drawer" class="w-[460px] bg-carbon-900 border-l border-zinc-800 flex flex-col z-30 shadow-2xl transition-transform duration-200 translate-x-full fixed right-0 top-0 bottom-0 no-print">
        <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
            <div>
                <span class="text-[10px] font-mono uppercase text-crimson-500 font-bold">Configuração da Célula</span>
                <h3 id="drawer-cell-name" class="text-sm font-bold text-white">Célula</h3>
            </div>
            <button onclick="app.closeDrawer()" class="text-zinc-400 hover:text-white p-2 rounded-lg hover:bg-zinc-800">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Abas -->
        <div class="flex border-b border-zinc-800 bg-carbon-950 text-xs font-semibold">
            <button onclick="app.setTab('geral')" id="tab-geral" class="flex-1 py-2.5 border-b-2 border-crimson-600 text-white">Geral & Crono</button>
            <button onclick="app.setTab('etapas')" id="tab-etapas" class="flex-1 py-2.5 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300">Etapas</button>
            <button onclick="app.setTab('bom')" id="tab-bom" class="flex-1 py-2.5 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300">Peças (BOM)</button>
            <button onclick="app.setTab('docs')" id="tab-docs" class="flex-1 py-2.5 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300">Ferram. & RQs</button>
        </div>

        <div id="drawer-content" class="flex-1 overflow-y-auto p-5 custom-scrollbar space-y-4"></div>

        <div class="p-4 border-t border-zinc-800 bg-carbon-900 flex justify-between items-center">
            <button onclick="app.deleteActiveCell()" class="text-xs text-crimson-500 hover:underline flex items-center gap-1.5">
                <i class="fa-solid fa-trash-can"></i> Remover Célula
            </button>
            <div class="flex gap-2">
                <button onclick="app.closeDrawer()" class="px-4 py-2 rounded-lg bg-zinc-800 text-xs text-zinc-300">Cancelar</button>
                <button onclick="app.saveDrawer()" class="px-5 py-2 rounded-lg bg-crimson-600 hover:bg-crimson-700 text-xs font-bold text-white">Salvar</button>
            </div>
        </div>
    </aside>

    <!-- MODAL PDF (IT GERAL + BOM) -->
    <div id="it-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-carbon-900 border border-zinc-800 rounded-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center no-print">
                <span class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf text-crimson-500"></i> Documento Técnico — IT Geral & BOM Consolidada
                </span>
                <div class="flex items-center gap-2">
                    <button onclick="window.print()" class="bg-crimson-600 hover:bg-crimson-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> Imprimir / Salvar PDF
                    </button>
                    <button onclick="app.closeITModal()" class="text-zinc-400 hover:text-white p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div id="print-section" class="flex-1 overflow-y-auto p-8 bg-white text-zinc-950 custom-scrollbar"></div>
        </div>
    </div>

    <script>
        const DEFAULT_DATA = {
            activePageId: 1,
            pages: [
                {
                    id: 1,
                    title: 'Linha 01 — Redutor Planetário',
                    photo: 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800&q=80',
                    result: 'Conjunto redutor montado, lubrificado e testado com torque nominal de 45 Nm e zero vazamento.',
                    cells: [
                        {
                            id: 11,
                            type: 'Subconjunto',
                            name: '01. Montagem das Engrenagens Satélites',
                            operator: 'Operador Montagem I',
                            input: 'Porta-satélites + 3 Engrenagens',
                            kanban: 'Lote 15 un.',
                            cycleObs: 38.0,
                            rating: 100,
                            allowance: 10,
                            steps: [
                                'Aplicar graxa sintética nos pinos dos satélites.',
                                'Encaixar as 3 engrenagens planetárias e travar com anel elástico.'
                            ],
                            bom: [
                                { code: 'ENG-304', desc: 'Engrenagem Satélite Aço Temperado', qty: 3, unit: 'un' },
                                { code: 'PRT-101', desc: 'Suporte Porta-Satélites', qty: 1, unit: 'un' }
                            ],
                            tools: ['Alicate de Anéis Internos', 'Aplicador de Graxa Pneumático'],
                            docs: ['IT-RED-01', 'RQ-04 (Folga Axial)']
                        },
                        {
                            id: 12,
                            type: 'Montagem',
                            name: '02. Fechamento da Carcaça e Torque',
                            operator: 'Operador Mecânico II',
                            input: 'Subconjunto + Carcaça Frontal',
                            kanban: 'Lote 15 un.',
                            cycleObs: 52.0,
                            rating: 105,
                            allowance: 12,
                            steps: [
                                'Posicionar junta de vedação na flange.',
                                'Fechar carcaça e apertar 6 parafusos M8 em cruz (25 Nm).'
                            ],
                            bom: [
                                { code: 'CRC-900', desc: 'Carcaça Frontal Alumínio', qty: 1, unit: 'un' },
                                { code: 'PRF-M8', desc: 'Parafuso Allen M8x30', qty: 6, unit: 'un' }
                            ],
                            tools: ['Torquímetro Digital 25 Nm'],
                            docs: ['IT-RED-02', 'RQ-08 (Estanqueidade)']
                        }
                    ]
                },
                {
                    id: 2,
                    title: 'Linha 02 — Painel de Comando Elétrico',
                    photo: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80',
                    result: 'Quadro elétrico cablado, anilhado e aprovado no teste de continuidade e isolação.',
                    cells: [
                        {
                            id: 21,
                            type: 'Montagem',
                            name: '01. Fixação de Trilhos DIN e Disjuntores',
                            operator: 'Montador Eletricista I',
                            input: 'Placa de Montagem + Componentes',
                            kanban: 'Lote 5 un.',
                            cycleObs: 65.0,
                            rating: 100,
                            allowance: 10,
                            steps: [
                                'Fixar trilhos DIN conforme gabarito.',
                                'Encaixar disjuntores, contatores e bornes.'
                            ],
                            bom: [
                                { code: 'DISJ-16A', desc: 'Disjuntor Bipolar 16A Curva C', qty: 2, unit: 'un' },
                                { code: 'CONT-24V', desc: 'Contator Tripolar Bobina 24Vcc', qty: 3, unit: 'un' }
                            ],
                            tools: ['Parafusadeira Elétrica', 'Chave Fenda Isolada'],
                            docs: ['ESQ-EL-20', 'RQ-EL-01']
                        }
                    ]
                }
            ]
        };

        let state = JSON.parse(localStorage.getItem('auttec_v2_data')) || DEFAULT_DATA;
        let activeCellId = null;
        let activeTab = 'geral';

        const app = {
            init() {
                this.render();
            },

            saveStorage() {
                localStorage.setItem('auttec_v2_data', JSON.stringify(state));
            },

            getCurrentPage() {
                return state.pages.find(p => p.id === state.activePageId) || state.pages[0];
            },

            calcStandardTime(cell) {
                return cell.cycleObs * (cell.rating / 100) * (1 + cell.allowance / 100);
            },

            render() {
                this.renderSidebar();
                this.renderWorkspace();
            },

            renderSidebar() {
                const list = document.getElementById('pages-list');
                list.innerHTML = state.pages.map(page => {
                    const isActive = page.id === state.activePageId;
                    return `
                        <button onclick="app.selectPage(${page.id})" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium transition flex items-center justify-between group ${isActive ? 'bg-crimson-600/15 text-white border border-crimson-600/40' : 'text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-200 border border-transparent'}">
                            <div class="flex items-center gap-2.5 truncate">
                                <span class="w-1.5 h-1.5 rounded-full ${isActive ? 'bg-crimson-500' : 'bg-zinc-600'}"></span>
                                <span class="truncate">${page.title}</span>
                            </div>
                            <span class="text-[10px] font-mono text-zinc-500">${page.cells.length}</span>
                        </button>
                    `;
                }).join('');
            },

            renderWorkspace() {
                const page = this.getCurrentPage();
                if (!page) return;

                document.getElementById('header-page-title').innerText = page.title;
                const totalCycle = page.cells.reduce((sum, c) => sum + this.calcStandardTime(c), 0);
                const totalItems = page.cells.reduce((sum, c) => sum + c.bom.length, 0);

                const workspace = document.getElementById('page-workspace');
                workspace.innerHTML = `
                    <!-- CARTÃO PRINCIPAL DA PÁGINA: NOME, FOTO E RESULTADO -->
                    <section class="bg-carbon-900 border border-zinc-800 rounded-xl p-5 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
                        <!-- Foto do Processo / Produto -->
                        <div class="lg:col-span-4">
                            <div class="relative group rounded-lg overflow-hidden border border-zinc-800 bg-carbon-950 aspect-video flex items-center justify-center">
                                ${page.photo 
                                    ? `<img src="${page.photo}" alt="Foto do processo" class="w-full h-full object-cover">`
                                    : `<div class="text-center text-zinc-600 text-xs p-4"><i class="fa-solid fa-image text-2xl mb-1 block"></i>Sem foto definida</div>`
                                }
                                <label class="absolute inset-0 bg-black/75 opacity-0 group-hover:opacity-100 transition flex flex-col items-center justify-center cursor-pointer text-xs font-semibold text-white gap-1">
                                    <i class="fa-solid fa-camera text-crimson-500 text-base"></i>
                                    <span>Alterar Foto</span>
                                    <input type="file" accept="image/*" onchange="app.uploadPhoto(event)" class="hidden">
                                </label>
                            </div>
                        </div>

                        <!-- Nome do Processo e Resultado Esperado -->
                        <div class="lg:col-span-8 space-y-4">
                            <div>
                                <label class="block text-[10px] font-mono uppercase tracking-wider text-crimson-500 font-bold mb-1">Nome do Processo / Produto</label>
                                <input type="text" value="${page.title}" oninput="app.updatePageField('title', this.value)" class="w-full bg-carbon-950 border border-zinc-800 focus:border-crimson-600 rounded-lg px-3.5 py-2 text-base font-bold text-white focus:outline-none">
                            </div>

                            <div>
                                <label class="block text-[10px] font-mono uppercase tracking-wider text-zinc-400 font-bold mb-1">Resultado / Entrega Final</label>
                                <textarea rows="2" oninput="app.updatePageField('result', this.value)" placeholder="Descreva o resultado final deste processo..." class="w-full bg-carbon-950 border border-zinc-800 focus:border-crimson-600 rounded-lg px-3.5 py-2 text-xs text-zinc-200 focus:outline-none resize-none">${page.result}</textarea>
                            </div>

                            <!-- Indicadores Diretos -->
                            <div class="grid grid-cols-3 gap-3 pt-1">
                                <div class="bg-carbon-950 border border-zinc-800/80 px-3 py-2 rounded-lg">
                                    <span class="text-[10px] text-zinc-500 block uppercase">Células</span>
                                    <span class="font-mono font-bold text-sm text-white">${page.cells.length} postos</span>
                                </div>
                                <div class="bg-carbon-950 border border-zinc-800/80 px-3 py-2 rounded-lg">
                                    <span class="text-[10px] text-zinc-500 block uppercase">Tempo Padrão Total</span>
                                    <span class="font-mono font-bold text-sm text-crimson-500">${totalCycle.toFixed(1)} s</span>
                                </div>
                                <div class="bg-carbon-950 border border-zinc-800/80 px-3 py-2 rounded-lg">
                                    <span class="text-[10px] text-zinc-500 block uppercase">Componentes BOM</span>
                                    <span class="font-mono font-bold text-sm text-white">${totalItems} SKUs</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- FLUXO SEQUENCIAL DE CÉLULAS -->
                    <section class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xs font-mono uppercase tracking-wider font-bold text-zinc-400 flex items-center gap-2">
                                <i class="fa-solid fa-diagram-project text-crimson-500"></i> Fluxo de Produção
                            </h2>
                            <div class="flex gap-2">
                                <button onclick="app.addCell('Subconjunto')" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                                    + Subconjunto
                                </button>
                                <button onclick="app.addCell('Montagem')" class="bg-crimson-600 hover:bg-crimson-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                                    + Célula de Montagem
                                </button>
                                <button onclick="app.addCell('Inspeção')" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                                    + Inspeção / Teste
                                </button>
                            </div>
                        </div>

                        <!-- Cards das Células em Fluxo -->
                        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                            ${page.cells.map((cell, idx) => {
                                const st = this.calcStandardTime(cell).toFixed(1);
                                return `
                                    <div class="bg-carbon-900 border border-zinc-800 hover:border-crimson-600/60 rounded-xl p-4 flex flex-col justify-between transition relative group">
                                        <div class="absolute top-0 left-0 w-1 h-full bg-crimson-600 rounded-l-xl"></div>
                                        
                                        <div>
                                            <div class="flex justify-between items-start gap-2 mb-2">
                                                <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-zinc-800 text-crimson-400 font-bold">
                                                    #${idx + 1} • ${cell.type}
                                                </span>
                                                <span class="font-mono text-xs font-bold text-white bg-carbon-950 px-2 py-0.5 rounded border border-zinc-800">
                                                    ${st} s
                                                </span>
                                            </div>
                                            <h3 class="font-bold text-sm text-white mb-3">${cell.name}</h3>
                                            
                                            <div class="space-y-1.5 text-xs text-zinc-400 bg-carbon-950 p-3 rounded-lg border border-zinc-800/80 mb-3">
                                                <div class="flex justify-between">
                                                    <span class="text-zinc-500">Operador:</span>
                                                    <span class="text-zinc-200 font-medium">${cell.operator}</span>
                                                </div>
                                                <div class="flex justify-between">
                                                    <span class="text-zinc-500">Kanban:</span>
                                                    <span class="text-zinc-200 font-medium">${cell.kanban}</span>
                                                </div>
                                                <div class="flex justify-between">
                                                    <span class="text-zinc-500">Input:</span>
                                                    <span class="text-zinc-200 font-medium truncate max-w-[160px]">${cell.input}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="flex items-center justify-between pt-2 border-t border-zinc-800/80 text-[11px] text-zinc-500">
                                            <div class="flex gap-3">
                                                <span><i class="fa-solid fa-list-ol text-crimson-500 mr-1"></i>${cell.steps.length} etapas</span>
                                                <span><i class="fa-solid fa-box text-zinc-400 mr-1"></i>${cell.bom.length} pçs</span>
                                                <span><i class="fa-solid fa-file-lines text-zinc-400 mr-1"></i>${cell.docs.length} RQs</span>
                                            </div>
                                            <button onclick="app.openDrawer(${cell.id})" class="bg-zinc-800 hover:bg-crimson-600 text-white px-3 py-1 rounded text-xs font-semibold transition">
                                                Editar
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </section>
                `;
            },

            // GERENCIAMENTO DE PÁGINAS
            selectPage(id) {
                state.activePageId = id;
                this.closeDrawer();
                this.saveStorage();
                this.render();
            },

            createPage() {
                const count = state.pages.length + 1;
                const newPage = {
                    id: Date.now(),
                    title: `Processo 0${count} — Novo Produto`,
                    photo: '',
                    result: 'Produto montado, inspecionado e liberado conforme padrão de qualidade.',
                    cells: []
                };
                state.pages.push(newPage);
                state.activePageId = newPage.id;
                this.saveStorage();
                this.render();
            },

            deleteCurrentPage() {
                if (state.pages.length <= 1) {
                    alert('Você precisa manter pelo menos uma página ativa.');
                    return;
                }
                if (confirm('Excluir esta página e todas as suas células?')) {
                    state.pages = state.pages.filter(p => p.id !== state.activePageId);
                    state.activePageId = state.pages[0].id;
                    this.saveStorage();
                    this.render();
                }
            },

            updatePageField(field, value) {
                const page = this.getCurrentPage();
                if (!page) return;
                page[field] = value;
                if (field === 'title') {
                    document.getElementById('header-page-title').innerText = value;
                    this.renderSidebar();
                }
                this.saveStorage();
            },

            uploadPhoto(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.updatePageField('photo', e.target.result);
                    this.renderWorkspace();
                };
                reader.readAsDataURL(file);
            },

            resetAll() {
                if (confirm('Restaurar dados padrão de fábrica?')) {
                    localStorage.removeItem('auttec_v2_data');
                    location.reload();
                }
            },

            // GERENCIAMENTO DE CÉLULAS
            addCell(type) {
                const page = this.getCurrentPage();
                const idx = page.cells.length + 1;
                const newCell = {
                    id: Date.now(),
                    type,
                    name: `0${idx}. ${type} Padrão`,
                    operator: 'Operador I',
                    input: 'Material da etapa anterior',
                    kanban: 'Lote 10 un.',
                    cycleObs: 30.0,
                    rating: 100,
                    allowance: 10,
                    steps: ['Posicionar componente no dispositivo.', 'Executar montagem conforme padrão.'],
                    bom: [{ code: `SKU-00${idx}`, desc: 'Componente Padrão', qty: 1, unit: 'un' }],
                    tools: ['Ferramenta Padrão'],
                    docs: [`RQ-0${idx}`]
                };
                page.cells.push(newCell);
                this.saveStorage();
                this.render();
                this.openDrawer(newCell.id);
            },

            openDrawer(cellId) {
                activeCellId = cellId;
                activeTab = 'geral';
                const page = this.getCurrentPage();
                const cell = page.cells.find(c => c.id === cellId);
                if (!cell) return;

                document.getElementById('drawer-cell-name').innerText = cell.name;
                this.setTab('geral');
                document.getElementById('cell-drawer').classList.remove('translate-x-full');
            },

            closeDrawer() {
                activeCellId = null;
                document.getElementById('cell-drawer').classList.add('translate-x-full');
            },

            setTab(tab) {
                activeTab = tab;
                ['geral', 'etapas', 'bom', 'docs'].forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    btn.className = t === tab
                        ? 'flex-1 py-2.5 border-b-2 border-crimson-600 text-white'
                        : 'flex-1 py-2.5 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300';
                });
                this.renderDrawerContent();
            },

            renderDrawerContent() {
                const page = this.getCurrentPage();
                const cell = page.cells.find(c => c.id === activeCellId);
                if (!cell) return;
                const box = document.getElementById('drawer-content');

                if (activeTab === 'geral') {
                    const st = this.calcStandardTime(cell).toFixed(2);
                    box.innerHTML = `
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[11px] font-bold uppercase text-zinc-400 mb-1">Nome da Célula</label>
                                <input type="text" id="inp-name" value="${cell.name}" class="w-full bg-carbon-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:border-crimson-600 focus:outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold uppercase text-zinc-400 mb-1">Operador</label>
                                    <input type="text" id="inp-operator" value="${cell.operator}" class="w-full bg-carbon-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:border-crimson-600 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold uppercase text-zinc-400 mb-1">Kanban / Lote</label>
                                    <input type="text" id="inp-kanban" value="${cell.kanban}" class="w-full bg-carbon-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:border-crimson-600 focus:outline-none">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold uppercase text-zinc-400 mb-1">Input (Entrada)</label>
                                <input type="text" id="inp-input" value="${cell.input}" class="w-full bg-carbon-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:border-crimson-600 focus:outline-none">
                            </div>

                            <div class="pt-3 border-t border-zinc-800">
                                <div class="text-xs font-bold text-white mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-stopwatch text-crimson-500"></i> Cronoanálise
                                </div>
                                <div class="bg-carbon-950 p-3.5 rounded-lg border border-zinc-800 space-y-3">
                                    <div class="grid grid-cols-3 gap-2">
                                        <div>
                                            <label class="block text-[10px] text-zinc-400 mb-1">Ciclo Obs (s)</label>
                                            <input type="number" step="0.1" id="inp-cycle" value="${cell.cycleObs}" oninput="app.previewCrono()" class="w-full bg-carbon-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-white font-mono">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] text-zinc-400 mb-1">Ritmo (%)</label>
                                            <input type="number" id="inp-rating" value="${cell.rating}" oninput="app.previewCrono()" class="w-full bg-carbon-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-white font-mono">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] text-zinc-400 mb-1">Fadiga (%)</label>
                                            <input type="number" id="inp-allowance" value="${cell.allowance}" oninput="app.previewCrono()" class="w-full bg-carbon-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-white font-mono">
                                        </div>
                                    </div>
                                    <div class="bg-crimson-600/10 border border-crimson-600/30 rounded p-2.5 flex justify-between items-center">
                                        <span class="text-xs text-zinc-300">Tempo Médio Padrão:</span>
                                        <span id="crono-preview" class="font-mono font-bold text-crimson-500 text-sm">${st} s</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (activeTab === 'etapas') {
                    box.innerHTML = `
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-white">Etapas de Montagem</span>
                                <button onclick="app.addStep()" class="bg-crimson-600 text-white px-2.5 py-1 rounded text-xs font-bold">+ Etapa</button>
                            </div>
                            ${cell.steps.map((s, i) => `
                                <div class="flex gap-2 bg-carbon-950 p-2.5 rounded-lg border border-zinc-800">
                                    <span class="text-xs font-mono font-bold text-crimson-500 pt-1">${i + 1}.</span>
                                    <textarea oninput="app.editStep(${i}, this.value)" rows="2" class="flex-1 bg-transparent text-xs text-white focus:outline-none resize-none">${s}</textarea>
                                    <button onclick="app.delStep(${i})" class="text-zinc-600 hover:text-crimson-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (activeTab === 'bom') {
                    box.innerHTML = `
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-white">Peças & Códigos (BOM)</span>
                                <button onclick="app.addBom()" class="bg-crimson-600 text-white px-2.5 py-1 rounded text-xs font-bold">+ Peça</button>
                            </div>
                            ${cell.bom.map((b, i) => `
                                <div class="bg-carbon-950 p-2.5 rounded-lg border border-zinc-800 space-y-2">
                                    <div class="flex gap-2">
                                        <input type="text" value="${b.code}" oninput="app.editBom(${i}, 'code', this.value)" placeholder="Código" class="bg-carbon-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-crimson-400 w-28">
                                        <input type="number" step="any" value="${b.qty}" oninput="app.editBom(${i}, 'qty', this.value)" class="bg-carbon-900 border border-zinc-800 rounded px-2 py-1 text-xs text-white w-16 text-center">
                                        <input type="text" value="${b.unit}" oninput="app.editBom(${i}, 'unit', this.value)" class="bg-carbon-900 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-400 w-12 text-center">
                                        <button onclick="app.delBom(${i})" class="text-zinc-600 hover:text-crimson-500 ml-auto"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                    </div>
                                    <input type="text" value="${b.desc}" oninput="app.editBom(${i}, 'desc', this.value)" placeholder="Descrição da peça" class="w-full bg-carbon-900 border border-zinc-800 rounded px-2 py-1 text-xs text-white">
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (activeTab === 'docs') {
                    box.innerHTML = `
                        <div class="space-y-4">
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-white">Ferramentas</span>
                                    <button onclick="app.addTool()" class="text-xs text-crimson-500 font-bold">+ Adicionar</button>
                                </div>
                                <div class="space-y-1.5">
                                    ${cell.tools.map((t, i) => `
                                        <div class="flex items-center gap-2 bg-carbon-950 px-3 py-2 rounded-lg border border-zinc-800">
                                            <input type="text" value="${t}" oninput="app.editTool(${i}, this.value)" class="flex-1 bg-transparent text-xs text-white focus:outline-none">
                                            <button onclick="app.delTool(${i})" class="text-zinc-600 hover:text-crimson-500"><i class="fa-solid fa-xmark text-xs"></i></button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="pt-3 border-t border-zinc-800">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-white">Documentos & RQs</span>
                                    <button onclick="app.addDoc()" class="text-xs text-crimson-500 font-bold">+ Adicionar</button>
                                </div>
                                <div class="space-y-1.5">
                                    ${cell.docs.map((d, i) => `
                                        <div class="flex items-center gap-2 bg-carbon-950 px-3 py-2 rounded-lg border border-zinc-800">
                                            <input type="text" value="${d}" oninput="app.editDoc(${i}, this.value)" class="flex-1 bg-transparent text-xs text-white focus:outline-none">
                                            <button onclick="app.delDoc(${i})" class="text-zinc-600 hover:text-crimson-500"><i class="fa-solid fa-xmark text-xs"></i></button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }
            },

            previewCrono() {
                const c = parseFloat(document.getElementById('inp-cycle').value) || 0;
                const r = parseFloat(document.getElementById('inp-rating').value) || 100;
                const a = parseFloat(document.getElementById('inp-allowance').value) || 0;
                document.getElementById('crono-preview').innerText = `${(c * (r / 100) * (1 + a / 100)).toFixed(2)} s`;
            },

            saveDrawer() {
                const page = this.getCurrentPage();
                const cell = page.cells.find(c => c.id === activeCellId);
                if (!cell) return;

                if (activeTab === 'geral') {
                    cell.name = document.getElementById('inp-name').value.trim() || cell.name;
                    cell.operator = document.getElementById('inp-operator').value;
                    cell.kanban = document.getElementById('inp-kanban').value;
                    cell.input = document.getElementById('inp-input').value;
                    cell.cycleObs = parseFloat(document.getElementById('inp-cycle').value) || 0;
                    cell.rating = parseFloat(document.getElementById('inp-rating').value) || 100;
                    cell.allowance = parseFloat(document.getElementById('inp-allowance').value) || 0;
                }
                this.saveStorage();
                this.closeDrawer();
                this.render();
            },

            deleteActiveCell() {
                if (!activeCellId) return;
                if (confirm('Excluir esta célula?')) {
                    const page = this.getCurrentPage();
                    page.cells = page.cells.filter(c => c.id !== activeCellId);
                    this.saveStorage();
                    this.closeDrawer();
                    this.render();
                }
            },

            // Helpers de listas internas
            getCell() { return this.getCurrentPage().cells.find(c => c.id === activeCellId); },
            addStep() { this.getCell().steps.push('Nova etapa...'); this.renderDrawerContent(); },
            editStep(i, v) { this.getCell().steps[i] = v; this.saveStorage(); },
            delStep(i) { this.getCell().steps.splice(i, 1); this.renderDrawerContent(); },

            addBom() { this.getCell().bom.push({ code: 'COD-00', desc: 'Nova Peça', qty: 1, unit: 'un' }); this.renderDrawerContent(); },
            editBom(i, f, v) { this.getCell().bom[i][f] = v; this.saveStorage(); },
            delBom(i) { this.getCell().bom.splice(i, 1); this.renderDrawerContent(); },

            addTool() { this.getCell().tools.push('Nova Ferramenta'); this.renderDrawerContent(); },
            editTool(i, v) { this.getCell().tools[i] = v; this.saveStorage(); },
            delTool(i) { this.getCell().tools.splice(i, 1); this.renderDrawerContent(); },

            addDoc() { this.getCell().docs.push('Novo RQ'); this.renderDrawerContent(); },
            editDoc(i, v) { this.getCell().docs[i] = v; this.saveStorage(); },
            delDoc(i) { this.getCell().docs.splice(i, 1); this.renderDrawerContent(); },

            // GERADOR DE PDF (IT GERAL & BOM)
            openITModal() {
                const page = this.getCurrentPage();
                const totalCycle = page.cells.reduce((sum, c) => sum + this.calcStandardTime(c), 0);

                const bomMap = {};
                page.cells.forEach(c => {
                    c.bom.forEach(b => {
                        const k = b.code.trim().toUpperCase();
                        const q = parseFloat(b.qty) || 0;
                        if (bomMap[k]) bomMap[k].qty += q;
                        else bomMap[k] = { desc: b.desc, qty: q, unit: b.unit };
                    });
                });

                const bomRows = Object.entries(bomMap).map(([code, item]) => `
                    <tr>
                        <td class="border border-zinc-300 px-3 py-1.5 font-mono font-bold">${code}</td>
                        <td class="border border-zinc-300 px-3 py-1.5">${item.desc}</td>
                        <td class="border border-zinc-300 px-3 py-1.5 text-right font-bold">${item.qty} ${item.unit}</td>
                    </tr>
                `).join('');

                const cellsHtml = page.cells.map((c, idx) => `
                    <div class="border border-zinc-300 rounded p-4 mb-4 break-inside-avoid">
                        <div class="flex justify-between items-center border-b border-zinc-200 pb-2 mb-2">
                            <div>
                                <span class="text-[10px] font-bold uppercase text-red-600">Célula #${idx + 1} • ${c.type}</span>
                                <h4 class="font-bold text-sm text-zinc-900">${c.name}</h4>
                            </div>
                            <div class="text-right text-xs">
                                <span class="text-zinc-500">Tempo Padrão:</span>
                                <strong class="font-mono text-sm">${this.calcStandardTime(c).toFixed(2)} s</strong>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-xs bg-zinc-100 p-2 rounded mb-2">
                            <div><strong>Operador:</strong> ${c.operator}</div>
                            <div><strong>Input:</strong> ${c.input}</div>
                            <div><strong>Kanban:</strong> ${c.kanban}</div>
                        </div>
                        <div class="text-xs mb-2">
                            <strong>Etapas:</strong>
                            <ol class="list-decimal pl-5 mt-1 space-y-0.5">${c.steps.map(s => `<li>${s}</li>`).join('')}</ol>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-xs pt-2 border-t border-zinc-200">
                            <div>
                                <strong>Peças:</strong>
                                <ul class="font-mono text-[11px] mt-0.5">${c.bom.map(b => `<li>• ${b.code} - ${b.desc} (${b.qty} ${b.unit})</li>`).join('')}</ul>
                            </div>
                            <div>
                                <strong>Ferramentas & RQs:</strong>
                                <ul class="text-[11px] mt-0.5">${c.tools.map(t => `<li>• ${t}</li>`).join('')}${c.docs.map(d => `<li>• ${d}</li>`).join('')}</ul>
                            </div>
                        </div>
                    </div>
                `).join('');

                document.getElementById('print-section').innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-start border-b-2 border-zinc-900 pb-4">
                            <div>
                                <div class="text-xs font-black uppercase tracking-widest text-red-600">AUTTEC 2.0 • ENGENHARIA INDUSTRIAL</div>
                                <h1 class="text-xl font-extrabold text-zinc-950 mt-1">${page.title}</h1>
                                <p class="text-xs text-zinc-700 mt-1"><strong>Resultado Esperado:</strong> ${page.result}</p>
                            </div>
                            <div class="text-right text-xs text-zinc-600 shrink-0 ml-4">
                                <div>Data: <strong>${new Date().toLocaleDateString('pt-BR')}</strong></div>
                                <div>Ciclo Total: <strong>${totalCycle.toFixed(1)} s</strong></div>
                            </div>
                        </div>

                        ${page.photo ? `<div class="border border-zinc-300 rounded overflow-hidden max-h-56 flex justify-center bg-zinc-100"><img src="${page.photo}" class="object-contain max-h-56"></div>` : ''}

                        <div>
                            <h2 class="text-xs font-bold uppercase bg-zinc-900 text-white px-3 py-1.5 mb-2">1. Lista Consolidada de Materiais (BOM)</h2>
                            <table class="w-full text-xs border-collapse">
                                <thead>
                                    <tr class="bg-zinc-100">
                                        <th class="border border-zinc-300 px-3 py-1.5 text-left">Código</th>
                                        <th class="border border-zinc-300 px-3 py-1.5 text-left">Descrição</th>
                                        <th class="border border-zinc-300 px-3 py-1.5 text-right">Qtd Total</th>
                                    </tr>
                                </thead>
                                <tbody>${bomRows}</tbody>
                            </table>
                        </div>

                        <div>
                            <h2 class="text-xs font-bold uppercase bg-zinc-900 text-white px-3 py-1.5 mb-3">2. Instrução de Trabalho por Célula</h2>
                            ${cellsHtml}
                        </div>
                    </div>
                `;

                document.getElementById('it-modal').classList.remove('hidden');
            },

            closeITModal() {
                document.getElementById('it-modal').classList.add('hidden');
            }
        };

        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
