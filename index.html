<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTTEC 2.0 - Engenharia de Processos e Manufatura Enxuta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #print-section, #print-section * {
                visibility: visible;
            }
            #print-section {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 2rem;
            }
            .no-print {
                display: none !important;
            }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between no-print z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-brand-600 to-indigo-400 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-industry text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    AUTTEC <span class="text-xs bg-brand-500/20 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/30">v2.0 Pro</span>
                </h1>
                <p class="text-xs text-slate-400">Plataforma de Engenharia de Processos & Cronoanálise Industrial</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="app.openNewCellModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-lg shadow-brand-600/20">
                <i class="fa-solid fa-plus"></i> Adicionar Célula
            </button>
            <button onclick="app.generateITModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-file-pdf text-rose-400"></i> Gerar IT Geral & BOM
            </button>
            <button onclick="app.resetData()" class="bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-300 border border-slate-700 hover:border-rose-800/50 p-2 rounded-xl text-sm transition" title="Limpar Projeto">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- WORKSPACE / CANVAS -->
        <main class="flex-1 bg-slate-950 relative flex flex-col overflow-hidden" id="canvas-container">
            <!-- Grid Background Overlay -->
            <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:24px_24px] opacity-30 pointer-events-none"></div>

            <!-- Toolbar Superior do Canvas -->
            <div class="absolute top-4 left-4 z-10 bg-slate-900/90 backdrop-blur border border-slate-800 px-4 py-2 rounded-xl flex items-center gap-4 text-xs text-slate-400 shadow-xl">
                <span><i class="fa-solid fa-layer-group text-brand-400 mr-1"></i> <strong id="total-cells" class="text-white">0</strong> Células no Fluxo</span>
                <span class="text-slate-700">|</span>
                <span><i class="fa-solid fa-clock text-emerald-400 mr-1"></i> <strong id="total-cycle" class="text-white">0.0</strong> seg</span>
                <span class="text-slate-700">|</span>
                <span><i class="fa-solid fa-boxes-stacked text-amber-400 mr-1"></i> <strong id="total-skus" class="text-white">0</strong> Peças BOM</span>
            </div>

            <!-- Flow Cards Grid / List -->
            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar pt-20" id="cells-grid">
                <!-- Vazio inicial preenchido via JS -->
            </div>
        </main>

        <!-- SIDEBAR / PAINEL TÉCNICO DA CÉLULA -->
        <aside id="tech-panel" class="w-[500px] bg-slate-900 border-l border-slate-800 flex flex-col z-20 shadow-2xl transition-transform duration-300 translate-x-full absolute right-0 top-0 bottom-0">
            <!-- Cabeçalho do Painel -->
            <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <div class="flex items-center gap-3">
                    <span id="panel-type-icon" class="p-2 rounded-lg bg-brand-500/10 text-brand-400 text-lg"></span>
                    <div>
                        <h3 id="panel-title" class="font-bold text-white text-base">Editar Célula</h3>
                        <p id="panel-subtitle" class="text-xs text-slate-400">Configuração técnica de processo</p>
                    </div>
                </div>
                <button onclick="app.closePanel()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Abas do Painel -->
            <div class="flex border-b border-slate-800 bg-slate-950/40 text-xs font-medium text-slate-400">
                <button onclick="app.switchTab('general')" id="tab-btn-general" class="flex-1 py-3 text-center border-b-2 border-brand-500 text-brand-400 transition">Geral & Crono</button>
                <button onclick="app.switchTab('steps')" id="tab-btn-steps" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition">Etapas</button>
                <button onclick="app.switchTab('bom')" id="tab-btn-bom" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition">Peças (BOM)</button>
                <button onclick="app.switchTab('tools')" id="tab-btn-tools" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition">Ferramentas & RQs</button>
            </div>

            <!-- Conteúdo das Abas -->
            <div class="flex-1 overflow-y-auto p-5 custom-scrollbar space-y-6" id="panel-content">
                <!-- Gerado Dinamicamente -->
            </div>

            <!-- Rodapé do Painel -->
            <div class="p-4 border-t border-slate-800 bg-slate-900 flex justify-end gap-3">
                <button onclick="app.closePanel()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm transition">Cancelar</button>
                <button onclick="app.saveCurrentCell()" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-brand-600/20">Salvar Alterações</button>
            </div>
        </aside>

    </div>

    <!-- MODAL CRIAR/EDITAR CÉLULA BÁSICA -->
    <div id="cell-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cube text-brand-400"></i> Nova Célula de Processo
                </h3>
                <button onclick="app.closeNewCellModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome da Operação / Célula</label>
                    <input type="text" id="new-cell-name" placeholder="Ex: Montagem do Subconjunto Hidráulico" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Tipo de Processo</label>
                    <select id="new-cell-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                        <option value="montagem">Montagem Principal</option>
                        <option value="subconjunto">Montagem de Subconjunto</option>
                        <option value="usinagem">Usinagem / Fabricação</option>
                        <option value="inspecao">Inspeção e Qualidade</option>
                        <option value="embalagem">Embalagem e Expedição</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Operador (Qtd / Perfil)</label>
                        <input type="text" id="new-cell-operator" value="Operador Nível II" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Kanban / Lote Padrão</label>
                        <input type="text" id="new-cell-kanban" value="Lote 10 pçs" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex justify-end gap-3">
                <button onclick="app.closeNewCellModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm transition">Cancelar</button>
                <button onclick="app.createCell()" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-brand-600/20">Criar e Configurar</button>
            </div>
        </div>
    </div>

    <!-- MODAL IT GERAL & BOM (VISUALIZAÇÃO / IMPRESSÃO) -->
    <div id="it-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center no-print">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf text-rose-400"></i> Relatório de Instrução de Trabalho (IT) & BOM Consolidada
                </h3>
                <div class="flex items-center gap-3">
                    <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> Imprimir / Salvar PDF
                    </button>
                    <button onclick="app.closeITModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar bg-white text-slate-900" id="print-section">
                <!-- Conteúdo formatado tipo A4 gerado via JS -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT DA APLICAÇÃO -->
    <script>
        const appState = {
            cells: [
                {
                    id: 1,
                    name: "Preparação de Chassi e Estrutura",
                    type: "montagem",
                    operator: "Operador II (Mecânica)",
                    input: "Chassi bruto cortado a laser (SKU-CH-01)",
                    kanban: "Lote padrão 5 und",
                    cycleObs: 45.0,
                    rating: 105,
                    allowance: 12,
                    setup: 15.0,
                    steps: [
                        "Posicionar chassi no gabarito de montagem 01.",
                        "Conferir esquadro e nivelamento de acordo com RQ-01.",
                        "Fixar suportes laterais com parafusos M8x25 (Torque 25Nm)."
                    ],
                    bom: [
                        { code: "SKU-CH-01", desc: "Chassi Principal Aço 1020", qty: 1, unit: "pç" },
                        { code: "SKU-PR-08", desc: "Parafuso Allen M8x25 Zincado", qty: 8, unit: "pç" },
                        { code: "SKU-SP-02", desc: "Suporte Lateral Estampado", qty: 2, unit: "pç" }
                    ],
                    tools: [
                        "Chave de Torque Pneumática 25Nm",
                        "Gabarito de Alinhamento Gab-01",
                        "Paquímetro Digital 150mm"
                    ],
                    docs: [
                        "RQ-01 (Rastreabilidade Dimensional de Chassi)",
                        "IT-PR-01 (Procedimento de Fixação Estrutural)",
                        "Desenho Técnico: DT-CH-100 Rev.02"
                    ]
                },
                {
                    id: 2,
                    name: "Montagem do Subconjunto Hidráulico",
                    type: "subconjunto",
                    operator: "Operador Especializado III",
                    input: "Bloco Válvula + Mangueiras Flexíveis",
                    kanban: "Lote padrão 10 und",
                    cycleObs: 68.5,
                    rating: 100,
                    allowance: 10,
                    setup: 20.0,
                    steps: [
                        "Higienizar conexões hidráulicas com álcool isopropílico.",
                        "Aplicar vedante de rosca anaeróbico nas conexões NPT.",
                        "Conectar mangueiras de alta pressão conforme diagrama hidráulico."
                    ],
                    bom: [
                        { code: "SKU-BV-99", desc: "Bloco Válvulo Hidráulico 3 Vias", qty: 1, unit: "pç" },
                        { code: "SKU-MG-12", desc: "Mangueira Hidráulica 500mm 3000psi", qty: 2, unit: "pç" },
                        { code: "SKU-VD-05", desc: "Vedante Anaeróbico Trava Média 50ml", qty: 0.05, unit: "fr" }
                    ],
                    tools: [
                        "Chave Fixa 19mm",
                        "Torquímetro de Estalo 10-50Nm",
                        "Pistola de Teste de Pressão Pneumática"
                    ],
                    docs: [
                        "DT-HYD-202 (Esquema Hidráulico)",
                        "RQ-04 (Laudo de Estanqueidade e Pressão)",
                        "Checklist de Limpeza de Linha"
                    ]
                }
            ],
            activeCellId: null,
            activeTab: 'general'
        };

        const typeLabels = {
            montagem: { label: "Montagem Principal", icon: "fa-gears", color: "text-indigo-400", bg: "bg-indigo-500/10 border-indigo-500/30" },
            subconjunto: { label: "Subconjunto", icon: "fa-puzzle-piece", color: "text-blue-400", bg: "bg-blue-500/10 border-blue-500/30" },
            usinagem: { label: "Usinagem / Fabricação", icon: "fa-hammer", color: "text-amber-400", bg: "bg-amber-500/10 border-amber-500/30" },
            inspecao: { label: "Inspeção e Qualidade", icon: "fa-shield-halved", color: "text-emerald-400", bg: "bg-emerald-500/10 border-emerald-500/30" },
            embalagem: { label: "Embalagem e Expedição", icon: "fa-box-archive", color: "text-purple-400", bg: "bg-purple-500/10 border-purple-500/30" }
        };

        const app = {
            init() {
                this.render();
            },

            render() {
                this.renderCanvas();
                this.updateMetrics();
            },

            renderCanvas() {
                const grid = document.getElementById('cells-grid');
                if (appState.cells.length === 0) {
                    grid.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-96 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500 text-2xl mb-4">
                                <i class="fa-solid fa-diagram-project"></i>
                            </div>
                            <h3 class="text-white font-semibold text-lg mb-1">Nenhuma célula no fluxo</h3>
                            <p class="text-slate-400 text-sm max-w-sm mb-6">Comece adicionando a primeira célula de processo produtivo ao seu fluxo de montagem auttec.</p>
                            <button onclick="app.openNewCellModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-brand-600/20">
                                <i class="fa-solid fa-plus mr-2"></i> Adicionar Primeira Célula
                            </button>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="max-w-4xl mx-auto space-y-6 relative">';
                
                appState.cells.forEach((cell, index) => {
                    const cfg = typeLabels[cell.type] || typeLabels.montagem;
                    // Cálculo do Tempo Padrão Cronoanálise
                    // Tempo Padrão = Ciclo Obs * (Ritmo / 100) * (1 + Tolerância / 100)
                    const standardTime = (cell.cycleObs * (cell.rating / 100) * (1 + cell.allowance / 100)).toFixed(2);
                    
                    if (index > 0) {
                        html += `
                            <div class="flex justify-center my-[-12px] relative z-10">
                                <div class="bg-slate-900 border border-slate-800 text-slate-400 w-8 h-8 rounded-full flex items-center justify-center text-xs shadow-lg">
                                    <i class="fa-solid fa-arrow-down text-brand-400"></i>
                                </div>
                            </div>
                        `;
                    }

                    html += `
                        <div class="bg-slate-900 border border-slate-800 hover:border-brand-500/50 rounded-2xl p-6 transition group shadow-xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 bottom-0 w-1.5 bg-brand-500"></div>
                            
                            <div class="flex items-start justify-between gap-4 mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl ${cfg.bg} ${cfg.color} flex items-center justify-center font-bold text-base shadow-inner">
                                        <i class="fa-solid ${cfg.icon}"></i>
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-xs font-mono text-slate-400 uppercase tracking-wider">Célula #${index + 1}</span>
                                            <span class="text-[10px] px-2 py-0.5 rounded-full ${cfg.bg} ${cfg.color} border border-current/20">${cfg.label}</span>
                                        </div>
                                        <h3 class="text-lg font-bold text-white group-hover:text-indigo-300 transition">${cell.name}</h3>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="app.openPanel(${cell.id})" class="bg-slate-800 hover:bg-brand-600 hover:text-white text-slate-300 px-3.5 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1.5">
                                        <i class="fa-solid fa-sliders"></i> Configurar Célula
                                    </button>
                                    <button onclick="app.deleteCell(${cell.id})" class="text-slate-500 hover:text-rose-400 p-2 rounded-xl hover:bg-rose-500/10 transition" title="Excluir Célula">
                                        <i class="fa-solid fa-trash-can text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 text-xs">
                                <div>
                                    <span class="text-slate-400 block mb-0.5">Operador / Perfil</span>
                                    <strong class="text-slate-200 truncate block">${cell.operator}</strong>
                                </div>
                                <div>
                                    <span class="text-slate-400 block mb-0.5">Input de Material</span>
                                    <strong class="text-slate-200 truncate block">${cell.input}</strong>
                                </div>
                                <div>
                                    <span class="text-slate-400 block mb-0.5">Kanban / Lote</span>
                                    <strong class="text-slate-200 truncate block">${cell.kanban}</strong>
                                </div>
                                <div>
                                    <span class="text-slate-400 block mb-0.5">Tempo Padrão (Crono)</span>
                                    <strong class="text-emerald-400 font-mono text-sm">${standardTime} s</strong>
                                </div>
                            </div>

                            <div class="mt-4 flex items-center justify-between text-xs text-slate-400 pt-3 border-t border-slate-800/60">
                                <div class="flex items-center gap-4">
                                    <span><i class="fa-solid fa-list-check text-indigo-400 mr-1"></i> ${cell.steps.length} Etapas</span>
                                    <span><i class="fa-solid fa-box text-amber-400 mr-1"></i> ${cell.bom.length} Componentes BOM</span>
                                    <span><i class="fa-solid fa-wrench text-blue-400 mr-1"></i> ${cell.tools.length} Ferramentas</span>
                                    <span><i class="fa-solid fa-file-lines text-emerald-400 mr-1"></i> ${cell.docs.length} Documentos/RQs</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
                grid.innerHTML = html;
            },

            updateMetrics() {
                document.getElementById('total-cells').innerText = appState.cells.length;
                let totalCycle = 0;
                let totalSkus = 0;
                appState.cells.forEach(c => {
                    const st = c.cycleObs * (c.rating / 100) * (1 + c.allowance / 100);
                    totalCycle += st;
                    totalSkus += c.bom.length;
                });
                document.getElementById('total-cycle').innerText = totalCycle.toFixed(1);
                document.getElementById('total-skus').innerText = totalSkus;
            },

            openNewCellModal() {
                document.getElementById('cell-modal').classList.remove('hidden');
            },
            closeNewCellModal() {
                document.getElementById('cell-modal').classList.add('hidden');
            },
            createCell() {
                const name = document.getElementById('new-cell-name').value.trim() || "Nova Célula de Montagem";
                const type = document.getElementById('new-cell-type').value;
                const operator = document.getElementById('new-cell-operator').value;
                const kanban = document.getElementById('new-cell-kanban').value;

                const newCell = {
                    id: Date.now(),
                    name,
                    type,
                    operator,
                    input: "Material padrão fornecido pelo almoxarifado",
                    kanban,
                    cycleObs: 30.0,
                    rating: 100,
                    allowance: 10,
                    setup: 10.0,
                    steps: ["Posicionar componente base na bancada.", "Realizar fixação e conferência."],
                    bom: [{ code: "SKU-GEN-01", desc: "Componente Padrão de Montagem", qty: 1, unit: "pç" }],
                    tools: ["Chave combinada 13mm"],
                    docs: ["RQ-GERAL (Registro de Qualidade)"]
                };

                appState.cells.push(newCell);
                this.closeNewCellModal();
                document.getElementById('new-cell-name').value = '';
                this.render();
                this.openPanel(newCell.id);
            },

            deleteCell(id) {
                if (confirm("Deseja realmente remover esta célula do fluxo?")) {
                    appState.cells = appState.cells.filter(c => c.id !== id);
                    if (appState.activeCellId === id) this.closePanel();
                    this.render();
                }
            },

            resetData() {
                if (confirm("Deseja reiniciar o projeto inteiro e limpar todas as células?")) {
                    appState.cells = [];
                    this.closePanel();
                    this.render();
                }
            },

            openPanel(id) {
                appState.activeCellId = id;
                appState.activeTab = 'general';
                const cell = appState.cells.find(c => c.id === id);
                if (!cell) return;

                const cfg = typeLabels[cell.type] || typeLabels.montagem;
                document.getElementById('panel-title').innerText = cell.name;
                document.getElementById('panel-subtitle').innerText = `ID: #${cell.id} • ${cfg.label}`;
                document.getElementById('panel-type-icon').className = `p-2 rounded-lg ${cfg.bg} ${cfg.color} text-lg fa-solid ${cfg.icon}`;

                this.renderPanelContent();
                document.getElementById('tech-panel').classList.remove('translate-x-full');
            },

            closePanel() {
                document.getElementById('tech-panel').classList.add('translate-x-full');
                appState.activeCellId = null;
            },

            switchTab(tab) {
                appState.activeTab = tab;
                ['general', 'steps', 'bom', 'tools'].forEach(t => {
                    const btn = document.getElementById(`tab-btn-${t}`);
                    if (t === tab) {
                        btn.className = "flex-1 py-3 text-center border-b-2 border-brand-500 text-brand-400 transition font-medium";
                    } else {
                        btn.className = "flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition text-slate-400";
                    }
                });
                this.renderPanelContent();
            },

            renderPanelContent() {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (!cell) return;
                const container = document.getElementById('panel-content');

                if (appState.activeTab === 'general') {
                    const st = (cell.cycleObs * (cell.rating / 100) * (1 + cell.allowance / 100)).toFixed(2);
                    container.innerHTML = `
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome da Célula / Operação</label>
                                <input type="text" id="edit-name" value="${cell.name}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Tipo de Processo</label>
                                    <select id="edit-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                                        <option value="montagem" ${cell.type==='montagem'?'selected':''}>Montagem Principal</option>
                                        <option value="subconjunto" ${cell.type==='subconjunto'?'selected':''}>Subconjunto</option>
                                        <option value="usinagem" ${cell.type==='usinagem'?'selected':''}>Usinagem</option>
                                        <option value="inspecao" ${cell.type==='inspecao'?'selected':''}>Inspeção</option>
                                        <option value="embalagem" ${cell.type==='embalagem'?'selected':''}>Embalagem</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Kanban / Lote Padrão</label>
                                    <input type="text" id="edit-kanban" value="${cell.kanban}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Operador / Perfil Requerido</label>
                                <input type="text" id="edit-operator" value="${cell.operator}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Input de Material / Matéria-prima</label>
                                <input type="text" id="edit-input" value="${cell.input}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                            </div>

                            <div class="pt-4 border-t border-slate-800">
                                <h4 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                                    <i class="fa-solid fa-stopwatch text-emerald-400"></i> Calculadora de Cronoanálise
                                </h4>
                                <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800 space-y-3">
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Ciclo Observado (s)</label>
                                            <input type="number" step="0.1" id="edit-cycle" value="${cell.cycleObs}" oninput="app.calcLivePreview()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                                        </div>
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Ritmo do Operador (%)</label>
                                            <input type="number" id="edit-rating" value="${cell.rating}" oninput="app.calcLivePreview()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Tolerância / Fadiga (%)</label>
                                            <input type="number" id="edit-allowance" value="${cell.allowance}" oninput="app.calcLivePreview()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                                        </div>
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Setup / Preparação (min)</label>
                                            <input type="number" step="0.1" id="edit-setup" value="${cell.setup}" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                                        </div>
                                    </div>
                                    <div class="mt-3 p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-between">
                                        <span class="text-xs text-emerald-300 font-medium">Tempo Padrão Calculado:</span>
                                        <span id="live-standard-time" class="text-emerald-400 font-mono font-bold text-base">${st} s</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (appState.activeTab === 'steps') {
                    let stepsHtml = cell.steps.map((step, idx) => `
                        <div class="flex items-start gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 group">
                            <span class="bg-slate-900 text-brand-400 text-xs font-mono font-bold w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border border-slate-800">${idx+1}</span>
                            <textarea oninput="app.updateStep(${idx}, this.value)" class="flex-1 bg-transparent text-sm text-white focus:outline-none resize-none" rows="2">${step}</textarea>
                            <button onclick="app.removeStep(${idx})" class="text-slate-600 hover:text-rose-400 p-1 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `).join('');

                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <h4 class="text-sm font-bold text-white">Etapas Sequenciais do Processo</h4>
                                <button onclick="app.addStep()" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> Adicionar Etapa
                                </button>
                            </div>
                            <div class="space-y-3" id="steps-list-container">
                                ${stepsHtml || '<p class="text-xs text-slate-500 text-center py-6">Nenhuma etapa cadastrada.</p>'}
                            </div>
                        </div>
                    `;
                } else if (appState.activeTab === 'bom') {
                    let bomHtml = cell.bom.map((item, idx) => `
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2 relative">
                            <div class="flex items-center justify-between">
                                <input type="text" value="${item.code}" oninput="app.updateBom(${idx}, 'code', this.value)" placeholder="Código SKU" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs font-mono text-brand-400 w-36 font-semibold">
                                <button onclick="app.removeBom(${idx})" class="text-slate-600 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                            </div>
                            <input type="text" value="${item.desc}" oninput="app.updateBom(${idx}, 'desc', this.value)" placeholder="Descrição da Peça / Componente" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white">
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[10px] text-slate-400 mb-0.5">Qtd</label>
                                    <input type="number" step="any" value="${item.qty}" oninput="app.updateBom(${idx}, 'qty', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 mb-0.5">Unidade</label>
                                    <input type="text" value="${item.unit}" oninput="app.updateBom(${idx}, 'unit', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white">
                                </div>
                            </div>
                        </div>
                    `).join('');

                    container.innerHTML = `
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <h4 class="text-sm font-bold text-white">Lista de Peças e Componentes (BOM)</h4>
                                <button onclick="app.addBom()" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> Adicionar Item
                                </button>
                            </div>
                            <div class="space-y-3">
                                ${bomHtml || '<p class="text-xs text-slate-500 text-center py-6">Nenhum componente BOM cadastrado.</p>'}
                            </div>
                        </div>
                    `;
                } else if (appState.activeTab === 'tools') {
                    let toolsHtml = cell.tools.map((t, idx) => `
                        <div class="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                            <i class="fa-solid fa-wrench text-blue-400 ml-2"></i>
                            <input type="text" value="${t}" oninput="app.updateTool(${idx}, this.value)" class="flex-1 bg-transparent text-xs text-white focus:outline-none">
                            <button onclick="app.removeTool(${idx})" class="text-slate-600 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    `).join('');

                    let docsHtml = cell.docs.map((d, idx) => `
                        <div class="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                            <i class="fa-solid fa-file-lines text-emerald-400 ml-2"></i>
                            <input type="text" value="${d}" oninput="app.updateDoc(${idx}, this.value)" class="flex-1 bg-transparent text-xs text-white focus:outline-none">
                            <button onclick="app.removeDoc(${idx})" class="text-slate-600 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    `).join('');

                    container.innerHTML = `
                        <div class="space-y-6">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <h4 class="text-xs font-bold uppercase text-slate-400">Ferramentas e Dispositivos</h4>
                                    <button onclick="app.addTool()" class="text-xs text-brand-400 hover:underline"><i class="fa-solid fa-plus mr-1"></i> Adicionar</button>
                                </div>
                                <div class="space-y-2">${toolsHtml}</div>
                            </div>
                            <div class="pt-4 border-t border-slate-800">
                                <div class="flex items-center justify-between mb-2">
                                    <h4 class="text-xs font-bold uppercase text-slate-400">Documentos e Registros de Qualidade (RQs)</h4>
                                    <button onclick="app.addDoc()" class="text-xs text-brand-400 hover:underline"><i class="fa-solid fa-plus mr-1"></i> Adicionar</button>
                                </div>
                                <div class="space-y-2">${docsHtml}</div>
                            </div>
                        </div>
                    `;
                }
            },

            calcLivePreview() {
                const c = parseFloat(document.getElementById('edit-cycle').value) || 0;
                const r = parseFloat(document.getElementById('edit-rating').value) || 100;
                const a = parseFloat(document.getElementById('edit-allowance').value) || 0;
                const st = (c * (r / 100) * (1 + a / 100)).toFixed(2);
                document.getElementById('live-standard-time').innerText = st + " s";
            },

            // Métodos de edição de etapas, BOM, ferramentas
            addStep() {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.steps.push("Nova etapa de montagem..."); this.renderPanelContent(); }
            },
            updateStep(idx, val) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) cell.steps[idx] = val;
            },
            removeStep(idx) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.steps.splice(idx, 1); this.renderPanelContent(); }
            },

            addBom() {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.bom.push({ code: "SKU-NEW", desc: "Novo componente", qty: 1, unit: "pç" }); this.renderPanelContent(); }
            },
            updateBom(idx, field, val) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) cell.bom[idx][field] = val;
            },
            removeBom(idx) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.bom.splice(idx, 1); this.renderPanelContent(); }
            },

            addTool() {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.tools.push("Nova ferramenta"); this.renderPanelContent(); }
            },
            updateTool(idx, val) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) cell.tools[idx] = val;
            },
            removeTool(idx) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.tools.splice(idx, 1); this.renderPanelContent(); }
            },

            addDoc() {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.docs.push("Novo RQ / Documento"); this.renderPanelContent(); }
            },
            updateDoc(idx, val) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) cell.docs[idx] = val;
            },
            removeDoc(idx) {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (cell) { cell.docs.splice(idx, 1); this.renderPanelContent(); }
            },

            saveCurrentCell() {
                const cell = appState.cells.find(c => c.id === appState.activeCellId);
                if (!cell) return;

                if (appState.activeTab === 'general') {
                    cell.name = document.getElementById('edit-name').value.trim() || cell.name;
                    cell.type = document.getElementById('edit-type').value;
                    cell.kanban = document.getElementById('edit-kanban').value;
                    cell.operator = document.getElementById('edit-operator').value;
                    cell.input = document.getElementById('edit-input').value;
                    cell.cycleObs = parseFloat(document.getElementById('edit-cycle').value) || cell.cycleObs;
                    cell.rating = parseFloat(document.getElementById('edit-rating').value) || cell.rating;
                    cell.allowance = parseFloat(document.getElementById('edit-allowance').value) || cell.allowance;
                    cell.setup = parseFloat(document.getElementById('edit-setup').value) || cell.setup;
                }

                this.closePanel();
                this.render();
            },

            // Gerador de IT Geral & BOM Consolidada
            generateITModal() {
                const modal = document.getElementById('it-modal');
                const printSec = document.getElementById('print-section');

                let totalCycleSum = 0;
                
                // Consolidar BOM total somando repetidos
                let bomMap = {};
                appState.cells.forEach(c => {
                    c.bom.forEach(item => {
                        const code = item.code.trim().toUpperCase();
                        const qty = parseFloat(item.qty) || 0;
                        if (bomMap[code]) {
                            bomMap[code].qty += qty;
                        } else {
                            bomMap[code] = { desc: item.desc, qty: qty, unit: item.unit };
                        }
                    });
                });

                let cellsHtml = appState.cells.map((cell, idx) => {
                    const st = (cell.cycleObs * (cell.rating / 100) * (1 + cell.allowance / 100)).toFixed(2);
                    totalCycleSum += parseFloat(st);
                    const cfg = typeLabels[cell.type] || typeLabels.montagem;

                    let stepsList = cell.steps.map((s, i) => `<li class="mb-1"><strong>Passo ${i+1}:</strong> ${s}</li>`).join('');
                    let bomList = cell.bom.map(b => `<tr><td class="border border-slate-300 px-2 py-1 font-mono">${b.code}</td><td class="border border-slate-300 px-2 py-1">${b.desc}</td><td class="border border-slate-300 px-2 py-1 text-right">${b.qty} ${b.unit}</td></tr>`).join('');
                    let toolsList = cell.tools.map(t => `<li>• ${t}</li>`).join('');
                    let docsList = cell.docs.map(d => `<li>• ${d}</li>`).join('');

                    return `
                        <div class="mb-8 border-b border-slate-300 pb-6 page-break">
                            <div class="flex justify-between items-center bg-slate-100 p-3 rounded-lg mb-3 border border-slate-200">
                                <div>
                                    <span class="text-xs font-bold text-indigo-600 uppercase">Célula ${idx+1} — ${cfg.label}</span>
                                    <h4 class="text-base font-bold text-slate-900">${cell.name}</h4>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-slate-500 block">Tempo Padrão</span>
                                    <strong class="text-emerald-600 font-mono text-sm">${st} s</strong>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 text-xs mb-3 text-slate-700">
                                <div><strong>Operador:</strong> ${cell.operator}</div>
                                <div><strong>Input:</strong> ${cell.input}</div>
                                <div><strong>Kanban:</strong> ${cell.kanban}</div>
                                <div><strong>Setup:</strong> ${cell.setup} min</div>
                            </div>
                            <div class="mb-3 text-xs">
                                <strong class="text-slate-900 block mb-1">Etapas de Montagem:</strong>
                                <ol class="list-decimal pl-4 text-slate-700 space-y-0.5">${stepsList}</ol>
                            </div>
                            <div class="grid grid-cols-2 gap-4 text-xs">
                                <div>
                                    <strong class="text-slate-900 block mb-1">Ferramentas & RQs:</strong>
                                    <ul class="text-slate-700 space-y-0.5">${toolsList}${docsList}</ul>
                                </div>
                                <div>
                                    <strong class="text-slate-900 block mb-1">Peças da Célula:</strong>
                                    <table class="w-full text-[11px] border-collapse">
                                        <thead><tr class="bg-slate-50"><th class="border border-slate-300 px-2 py-0.5 text-left">SKU</th><th class="border border-slate-300 px-2 py-0.5 text-left">Qtd</th></tr></thead>
                                        <tbody>${cell.bom.map(b=>`<tr><td class="border border-slate-300 px-2 py-1 font-mono">${b.code}</td><td class="border border-slate-300 px-2 py-1">${b.qty} ${b.unit}</td></tr>`).join('')}</tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                let consolidatedBomRows = Object.keys(bomMap).map(code => {
                    let item = bomMap[code];
                    return `<tr>
                        <td class="border border-slate-300 px-3 py-1.5 font-mono font-bold">${code}</td>
                        <td class="border border-slate-300 px-3 py-1.5">${item.desc}</td>
                        <td class="border border-slate-300 px-3 py-1.5 text-right font-semibold">${item.qty} ${item.unit}</td>
                    </tr>`;
                }).join('');

                printSec.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-start border-b-2 border-slate-900 pb-4">
                            <div>
                                <h1 class="text-2xl font-black text-slate-900 tracking-tight">AUTTEC 2.0</h1>
                                <p class="text-xs text-slate-600 uppercase font-semibold">Instrução de Trabalho (IT) Geral & Lista Mestra BOM</p>
                            </div>
                            <div class="text-right text-xs text-slate-600">
                                <p><strong>Data:</strong> ${new Date().toLocaleDateString('pt-BR')}</p>
                                <p><strong>Ciclo Total Linha:</strong> <span class="text-emerald-600 font-bold font-mono">${totalCycleSum.toFixed(1)} s</span></p>
                                <p><strong>Total de Células:</strong> ${appState.cells.length}</p>
                            </div>
                        </div>

                        <div>
                            <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wide bg-slate-200 px-3 py-1.5 mb-3 rounded">1. Lista Consolidada de Materiais (BOM Total do Produto)</h2>
                            <table class="w-full text-xs border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-900">
                                        <th class="border border-slate-300 px-3 py-2 text-left">Código SKU</th>
                                        <th class="border border-slate-300 px-3 py-2 text-left">Descrição do Componente</th>
                                        <th class="border border-slate-300 px-3 py-2 text-right">Qtd Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${consolidatedBomRows || '<tr><td colspan="3" class="border border-slate-300 px-3 py-3 text-center text-slate-500">Nenhum componente cadastrado.</td></tr>'}
                                </tbody>
                            </table>
                        </div>

                        <div class="pt-4">
                            <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wide bg-slate-200 px-3 py-1.5 mb-4 rounded">2. Detalhamento das Células e Instruções de Montagem</h2>
                            ${cellsHtml || '<p class="text-slate-500 text-xs text-center py-6">Nenhuma célula cadastrada.</p>'}
                        </div>
                    </div>
                `;

                modal.classList.remove('hidden');
            },

            closeITModal() {
                document.getElementById('it-modal').classList.add('hidden');
            }
        };

        // Inicializar aplicação
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
